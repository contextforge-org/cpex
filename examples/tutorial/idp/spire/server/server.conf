# SPIRE server for the CPEX tutorial's workload-identity module (16).
#
# Minimal, dev-only: mints JWT-SVIDs directly off the server (no agent, no
# node/workload attestation). A genuine SPIRE-signed ES256 SVID against
# SPIRE's real JWKS, with a two-container footprint (server + oidc).
#
# NEVER use this configuration in production.
server {
    bind_address = "0.0.0.0"
    bind_port    = "8082"          # NOT 8081, which Keycloak owns.
    trust_domain = "cpex.tutorial"
    data_dir     = "/opt/spire/data/server"
    log_level    = "INFO"

    ca_ttl                = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl  = "1h"

    # The `iss` SPIRE stamps into JWT-SVIDs. Keycloak validates SVIDs
    # against this issuer's JWKS (published by the oidc provider below).
    jwt_issuer = "http://spire-oidc:8443"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
    # Present so the server boots; we mint SVIDs directly, no nodes attest.
    NodeAttestor "join_token" {
        plugin_data {}
    }
}
