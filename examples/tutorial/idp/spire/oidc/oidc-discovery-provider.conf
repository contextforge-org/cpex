# SPIRE OIDC Discovery Provider for the CPEX tutorial (module 16).
#
# Publishes SPIRE's JWKS + an OIDC discovery document so Keycloak (and CPEX's
# jwt-workload resolver) can validate JWT-SVIDs against SPIRE's signing keys.
# Reads the trust bundle from the server over its shared admin socket.
#
# NEVER use this configuration (insecure_addr, no TLS) in production.
log_level = "info"
domains = ["spire-oidc", "localhost"]
insecure_addr = "0.0.0.0:8443"
set_key_use = true

server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}
