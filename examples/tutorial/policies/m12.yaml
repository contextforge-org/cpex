# Module 12, Delegation subjects (who the downstream call speaks for)
#
# Module 6 minted a downstream token on behalf of the caller. But a delegation
# can speak for one of several principals, chosen with `subject:`:
#
#   subject: user           on behalf of the caller (the default). Exchanges
#                           the caller's token, so it needs a caller.
#   subject: this_workload  as the gateway itself. Uses the gateway's own
#                           client credentials (RFC 6749 client_credentials);
#                           no caller token required.
#
# The mode is DERIVED from `subject`, never declared, so a route can't claim
# on-behalf-of-user while handing over some other credential.
#
# Two routes make the difference observable:
#   - get_compensation exchanges the CALLER's token (subject: user). An
#     anonymous request has no token to exchange, so delegation fails.
#   - search_repos calls as the GATEWAY (subject: this_workload). It works
#     with no caller at all, because the gateway holds the downstream
#     credential.

plugins:
  - name: keycloak
    kind: identity/jwt
    hooks: [identity.resolve]
    config:
      claim_mapper: standard
      trusted_issuers:
        - issuer: http://localhost:8081/realms/cpex-tutorial
          audiences: [cpex-tutorial]
          algorithms: [RS256]
          decoding_key:
            kind: jwks_url
            url: http://localhost:8081/realms/cpex-tutorial/protocol/openid-connect/certs
            insecure_http: true
          leeway_seconds: 60

  - name: workday-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    capabilities: [read_inbound_credentials, write_delegated_tokens]
    config:
      token_endpoint: http://localhost:8081/realms/cpex-tutorial/protocol/openid-connect/token
      client_id: cpex-gateway
      client_secret_source:
        kind: literal
        secret: gateway-dev-secret
      insecure_http: true

routes:
  # On behalf of the caller. `subject: user` (the default) exchanges the
  # caller's token, so a request with no token has nothing to exchange and
  # delegation fails at require(delegation.granted).
  - tool: get_compensation
    authentication:
      - keycloak
    authorization:
      pre_invocation:
        - "delegate(workday-oauth, target: workday-api, audience: workday-api, subject: user)"
        - "require(delegation.granted)"

  # As the gateway itself. `subject: this_workload` uses the gateway's own
  # client credentials, so it needs no caller token at all: the enforcement
  # point, not the caller, holds the downstream authority.
  - tool: search_repos
    authorization:
      pre_invocation:
        - "delegate(workday-oauth, target: github-api, audience: github-api, subject: this_workload)"
        - "require(delegation.granted)"
