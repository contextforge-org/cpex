# Module 16, Workload identity (the agent proves itself with a SPIFFE SVID).
#
# The caller here is neither a human nor an OAuth client with a secret: it is a
# workload with a SPIFFE identity. It presents its JWT-SVID, an ES256 JWT
# signed by SPIRE rather than the IdP, on X-Workload-Token. CPEX validates it
# against SPIRE's JWKS and lands it in the `caller_workload` slot.
#
# An SVID is a SPIFFE identity credential, NOT an OAuth token: it can't be
# forwarded downstream or used as an exchange subject as-is. So `subject:
# caller_workload` runs TWO legs:
#   leg 1  present the SVID as an RFC 8693/7523 client_assertion
#          (type ...:jwt-spiffe) to authenticate the agent as its IdP client,
#          and receive an ordinary IdP token;
#   leg 2  exchange that token for the scoped downstream token.
#
# The agent holds no standing entitlement to the target: CPEX brokers the
# scope-up with its OWN gateway credential (leg 2). A compromised agent can
# prove who it is but cannot mint the downstream token itself.
#
# See the cookbook, Recipe 2 (Agent acting as itself, by its SPIFFE SVID).
# Needs the SPIRE overlay and its setup script, see idp/docker-compose.spire.yml.

plugins:
  # The workload SVID, on X-Workload-Token -> caller_workload slot. Validated
  # against SPIRE's JWKS (the spire-oidc discovery provider on :8443), ES256,
  # with the SVID's audience = the tutorial realm issuer (the draft requires
  # the SVID's sole audience to be the authorization server it authenticates to).
  - name: jwt-workload
    kind: identity/jwt
    hooks: [identity.resolve]
    config:
      role: caller_workload
      header: X-Workload-Token
      claim_mapper: standard
      trusted_issuers:
        - issuer: http://spire-oidc:8443
          audiences: [http://localhost:8081/realms/cpex-tutorial]
          algorithms: [ES256]
          decoding_key:
            kind: jwks_url
            url: http://localhost:8443/keys
            insecure_http: true
          leeway_seconds: 60

  - name: workday-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    capabilities: [read_inbound_credentials, write_delegated_tokens]
    config:
      token_endpoint: http://localhost:8081/realms/cpex-tutorial/protocol/openid-connect/token
      client_id: cpex-gateway
      client_secret_source:
        kind: literal
        secret: gateway-dev-secret
      insecure_http: true

routes:
  # The agent authenticates by SVID alone (no user/client token) and CPEX
  # brokers a github-api-scoped token from it via the two-leg exchange.
  - tool: search_repos
    authentication:
      - jwt-workload
    authorization:
      pre_invocation:
        - "delegate(workday-oauth, target: github-api, audience: github-api, subject: caller_workload)"
        - "require(delegation.granted)"
