#
# CPEX Demo FFI — demo plugins for Go example.
#
# Builds a staticlib that includes cpex-ffi symbols transitively.
# Go links only this library to get both the core FFI surface and
# the demo plugin factories.

[package]
name = "cpex-demo-ffi"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

# Demo example crate: follows the workspace version, but never publishes or
# creates its own release tag.
[package.metadata.release]
release = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
praxis-policy-core = { workspace = true }
cpex-ffi = { path = "../../../crates/cpex-ffi" }
async-trait = "0.1"
tracing = "0.1"

[lints]
workspace = true
