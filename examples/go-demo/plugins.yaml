# CPEX Go Demo — plugin configuration
#
# Three host demo plugins on the demo's own hooks (demo.tool_pre_invoke and
# demo.tool_post_invoke, registered by the demo FFI crate):
#   - Identity validation on every invocation
#   - PII guarding on tools tagged `pii` (the plugin reads the tag)
#   - Audit logging on all tools (fire-and-forget)
#
# Hook dispatch: each plugin fires at the hooks it declares, ordered by
# priority within its mode. No routes, groups or global policy.

engine_settings:
  dispatch: hooks
  plugin_timeout: 30

plugins:
  - name: identity-checker
    kind: demo/identity
    hooks: [demo.tool_pre_invoke, demo.tool_post_invoke]
    mode: sequential
    priority: 10
    on_error: fail

  - name: pii-guard
    kind: demo/pii
    hooks: [demo.tool_pre_invoke]
    mode: sequential
    priority: 20
    on_error: fail

  - name: audit-logger
    kind: demo/audit
    hooks: [demo.tool_pre_invoke, demo.tool_post_invoke]
    mode: fire_and_forget
    priority: 100
    on_error: ignore
