# CMF Demo — plugin configuration
#
# Two host demo plugins demonstrating typed message processing:
#   - Tool policy: checks tool permissions against security labels
#   - Header injector: adds response headers after processing
#
# Uses cmf.tool_pre_invoke and cmf.tool_post_invoke hooks with
# MessagePayload (typed CMF messages, not generic maps).
#
# Hook dispatch: each plugin fires at the hooks it declares, ordered by
# priority within its mode, for every tool.

engine_settings:
  dispatch: hooks
  plugin_timeout: 30

plugins:
  - name: tool-policy
    kind: demo/cmf-tool-policy
    hooks: [cmf.tool_pre_invoke]
    mode: sequential
    priority: 10
    on_error: fail
    capabilities:
      - read_labels
      - read_subject

  - name: header-injector
    kind: demo/cmf-header-injector
    hooks: [cmf.tool_pre_invoke, cmf.tool_post_invoke]
    mode: sequential
    priority: 50
    on_error: ignore
    capabilities:
      - read_headers
      - write_headers
