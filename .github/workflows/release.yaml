# ===============================================================
# Release - publish the CPEX library crates to crates.io
# ===============================================================
#
# Triggered by a semver tag (vX.Y.Z). Validates the tag matches the
# workspace version, runs the test suite, then publishes every
# publishable crate to crates.io in dependency (leaf-first) order:
# cpex-hosts-python, cpex-plugin-delegator-biscuit, cpex, cpex-python.
#
# `cpex-ffi` is `publish = false` (distributed as signed prebuilt
# artifacts by release-ffi.yaml), so it is intentionally absent below,
# as are the example, tutorial and parity harness crates.
#
# Requires repo secret: CARGO_REGISTRY_TOKEN.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-releases: v0.3.0-rc.1, v1.0.0-rc.1, …
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package + verify all crates without uploading to crates.io"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - name: Check release versions, PPE dependencies and publishable members
        run: make release-check
      - name: Check publishing ref == workspace version
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag || { echo "::error::Publishing requires a release tag"; exit 1; }
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="cpex") | .version')"
          echo "tag=$TAG_VERSION workspace=$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match workspace version ($CARGO_VERSION)"
            exit 1
          fi

  test:
    name: Test before publish
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: make test

  package:
    name: Package and verify before publish
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      # A fresh registry avoids partially restored sparse-index resolutions.
      - run: make publish-dry

  publish:
    name: Publish to crates.io
    needs: [validate, test, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      # NOTE: intentionally NO Swatinem/rust-cache here. A restored partial
      # `~/.cargo/registry` index makes `cargo package/publish --locked` abort
      # with "cannot update the lock file" against the sparse index even when
      # Cargo.lock is correct (see the CI `package` job for the full rationale).
      # A fresh index each run keeps publish resolution deterministic.
      - name: cargo publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # true only for a manual workflow_dispatch with dry_run left on.
          # A real version-tag push has empty DRY_RUN → publishes for real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # Dependency order. Only these four members publish; the engine
          # itself comes from the praxis-policy crates on crates.io, which
          # are already there. `cpex` takes `cpex-hosts-python` as an
          # optional dependency, and cargo still needs it in the index, so
          # the host goes first. `cpex-plugin-delegator-biscuit` has no member
          # dependency; `cpex-python` depends on `cpex`, so it goes last.
          # Each `cargo publish`
          # blocks until the crate is visible in the index before returning,
          # so the next crate's dependency resolves; the short sleep is
          # extra slack for propagation.
          crates=(
            cpex-hosts-python
            cpex-plugin-delegator-biscuit
            cpex
            cpex-python
          )
          # The list must name exactly the publishable members: a missing one
          # stops the release halfway, as it did for 0.2.2. Compare against
          # cargo metadata first, in dry runs too. `publish = false` shows up
          # there as an empty list.
          expected="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)"
          listed="$(printf '%s\n' "${crates[@]}" | sort)"
          if [ "$expected" != "$listed" ]; then
            echo "::error::publish list does not match the publishable workspace members"
            diff <(echo "$expected") <(echo "$listed") || true
            exit 1
          fi
          # Dry run: build + verify a .crate for every publishable member
          # (cargo resolves inter-member deps against each other's packaged
          # versions) without uploading. This is how the workflow is
          # exercised without a real release.
          if [ "$DRY_RUN" = "true" ]; then
            echo "::group::dry run — cargo package (no upload)"
            # Verify the crates.io-published set only; these four
            # publish=false crates are not part of the registry release.
            # The package job has already built and verified every .crate.
            echo "All four retained crates packaged and verified; nothing uploaded."
            echo "::endgroup::"
            exit 0
          fi
          for c in "${crates[@]}"; do
            echo "::group::publish $c"
            # Idempotent: a prior run can publish a leading prefix of this
            # list and then fail further down (e.g. a downstream crate gained
            # a new dependency that was not yet in the list). crates.io rejects
            # re-publishing an existing version, so treat "already uploaded" as
            # success and continue — this lets a re-run of the same tag finish
            # the remaining crates instead of aborting on the first done one.
            if out="$(cargo publish -p "$c" --locked 2>&1)"; then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE 'already (exists|uploaded)|is already uploaded'; then
                echo "::notice::$c already published at this version — skipping"
              else
                exit 1
              fi
            fi
            echo "::endgroup::"
            sleep 15
          done
