# ===============================================================
# Tests - Run the test suite
# ===============================================================

name: Tests

# Reusable workflow only — invoked by ci.yml, which owns the branch filters.
# Do not add push/pull_request triggers here: ci.yml already calls this on those
# events, so its own triggers would run every job a second time.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]

    name: "Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Run tests
        run: |
          PYTHONPATH=cpex pytest -n auto tests
