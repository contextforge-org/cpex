# ===============================================================
# Docs Build - Verify documentation builds without errors
# ===============================================================

name: Docs Build

on:
  workflow_call:
  push:
    branches: ["main", "dev"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yaml"
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main", "dev"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yaml"

permissions:
  contents: read

jobs:
  docs-build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Hugo Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # Build with a root-relative baseURL so the link checker can resolve
      # internal links against the built files rather than the live site.
      - name: Build docs
        working-directory: docs
        run: hugo --minify --baseURL "/"

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # GitHub intermittently returns 503 for bursts of links to the demo
          # repository. Slow requests per host and retry transient failures.
          args: >-
            --no-progress --host-concurrency 2 --host-request-interval 250ms
            --max-retries 5 --retry-wait-time 2
            --root-dir "${{ github.workspace }}/docs/public" "docs/public/**/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check demo source links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh api 'repos/praxis-proxy/demos/git/trees/main?recursive=1' > "$RUNNER_TEMP/demo-tree.json"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 2))"
          done
          python3 - "$RUNNER_TEMP/demo-tree.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          tree = json.loads(Path(sys.argv[1]).read_text())
          if tree.get("truncated"):
              raise SystemExit("Demo repository tree was truncated")
          available = {entry["path"] for entry in tree["tree"] if entry["type"] == "blob"}
          prefix = "https://github.com/praxis-proxy/demos/blob/main/"
          pattern = re.compile(re.escape(prefix) + r"([^)\s#?]+)")
          missing = []
          checked = set()
          for source in Path("docs/content").rglob("*.md"):
              for path in pattern.findall(source.read_text()):
                  checked.add(path)
                  if path not in available:
                      missing.append((source, path))
          for source, path in missing:
              print(f"::error file={source}::Broken demo source link: {prefix}{path}")
          print(f"Checked {len(checked)} demo source links against the repository tree")
          if missing:
              raise SystemExit(1)
          PY
