# ===============================================================
# Docs Build - Verify documentation builds without errors
# ===============================================================

name: Docs Build

on:
  workflow_call:
  push:
    branches: ["main", "dev"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yaml"
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main", "dev"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yaml"

permissions:
  contents: read

jobs:
  docs-build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Hugo Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # Build with a root-relative baseURL so the link checker can resolve
      # internal links against the built files rather than the live site.
      - name: Build docs
        working-directory: docs
        run: hugo --minify --baseURL "/"

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # GitHub intermittently returns 503 for bursts of source links.
          # Slow requests per host and retry transient failures.
          args: >-
            --no-progress --host-concurrency 2 --host-request-interval 250ms
            --max-retries 5 --retry-wait-time 2
            --root-dir "${{ github.workspace }}/docs/public" "docs/public/**/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check external source links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for target in demos/main policy/v0.5.0; do
            repo="${target%/*}"
            ref="${target#*/}"
            for attempt in 1 2 3; do
              if gh api "repos/praxis-proxy/$repo/git/trees/$ref?recursive=1" > "$RUNNER_TEMP/$repo-tree.json"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 2))"
            done
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          missing = []
          for repo, ref in (("demos", "main"), ("policy", "v0.5.0")):
              tree = json.loads((Path(sys.argv[1]) / f"{repo}-tree.json").read_text())
              if tree.get("truncated"):
                  raise SystemExit(f"{repo} repository tree was truncated")
              available = {entry["path"] for entry in tree["tree"] if entry["type"] == "blob"}
              prefix = f"https://github.com/praxis-proxy/{repo}/blob/{ref}/"
              pattern = re.compile(re.escape(prefix) + r"([^)\s#?]+)")
              checked = set()
              for source in Path("docs/content").rglob("*.md"):
                  for path in pattern.findall(source.read_text()):
                      checked.add(path)
                      if path not in available:
                          missing.append((source, prefix + path))
              print(f"Checked {len(checked)} {repo} source links against the repository tree")
          for source, url in missing:
              print(f"::error file={source}::Broken external source link: {url}")
          if missing:
              raise SystemExit(1)
          PY
