# ===============================================================
# CI - Rust lint, test, examples, and docs gate
# ===============================================================

name: CI

on:
  push:
    # 0.1.x is the long-lived maintenance base branch for the 0.1 series
    branches: ["main", "dev", "0.1.x"]
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main", "dev", "0.1.x"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (fmt + clippy)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unused-deps:
    name: Unused deps (advisory)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: cargo-machete static analysis false-positives on
    # macro/derive-only crates (thiserror, tracing, serde, async-trait). Surfaced
    # as a non-blocking signal until the reports are triaged in a follow-up.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - run: cargo machete

  test:
    name: Tests
    uses: ./.github/workflows/tests.yaml

  # No docs job on 0.1.x: docs are built and published from main only.
  # Do not re-add a `uses: ./.github/workflows/docs-build.yaml` job here —
  # workflow_call bypasses that workflow's own main-only branch filter, so it
  # would run on this branch regardless.
