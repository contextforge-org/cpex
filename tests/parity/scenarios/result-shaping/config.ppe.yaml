# Result shaping: field redaction and masking on the post phase.
#
# Source: examples/tutorial/policies/m03.yaml, with identity from m02 so the
# permission and role predicates have callers that satisfy them.
#
# Migrated to the CPEX 0.3.0 (PPE) form from config.yaml in this directory:
# - plugins that call out over HTTP declare `perform_http`.
# - an open route uses `pre_invocation: ["allow"]` instead of an empty list.

plugins:
  - name: idp
    kind: identity/jwt
    hooks: [identity.resolve]
    capabilities: [perform_http]
    config:
      claim_mapper: standard
      trusted_issuers:
        - issuer: https://idp.parity.test
          audiences: [cpex-parity]
          algorithms: [EdDSA]
          decoding_key:
            kind: jwks_url
            url: "{{MOCK_URL}}/jwks"
            insecure_http: true
          leeway_seconds: 60

routes:
  - tool: get_compensation
    authentication:
      - idp
    authorization:
      pre_invocation: ["allow"]
    result:
      ssn: "str | redact(!perm.view_ssn)"
      salary: "int | redact(!role.hr)"
      employee_id: "str | mask(4)"
