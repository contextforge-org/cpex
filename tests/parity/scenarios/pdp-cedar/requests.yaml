description: >-
  Cedar permit, default deny, and an explicit forbid that names its policy
  id in the violation code.

mocks:
  - method: GET
    path: /jwks
    builtin: jwks

tokens:
  alice:
    claims: {iss: https://idp.parity.test, aud: cpex-parity, sub: alice, iat: 1767225600, exp: 4102444800, roles: [hr]}
  evan:
    claims: {iss: https://idp.parity.test, aud: cpex-parity, sub: evan, iat: 1767225600, exp: 4102444800, roles: [engineer]}
  carl:
    claims: {iss: https://idp.parity.test, aud: cpex-parity, sub: carl, iat: 1767225600, exp: 4102444800, roles: [hr, contractor]}

requests:
  - kind: mediate
    id: hr-permitted
    caller: {token: alice}
    tool: get_compensation
    args: {employee_id: e-1001}
    backend: {employee_id: e-1001, salary: 185000}

  - kind: mediate
    id: engineer-default-deny
    caller: {token: evan}
    tool: get_compensation
    args: {employee_id: e-1001}
    backend: {employee_id: e-1001, salary: 185000}

  - kind: mediate
    id: contractor-forbidden
    caller: {token: carl}
    tool: get_compensation
    args: {employee_id: e-1001}
    backend: {employee_id: e-1001, salary: 185000}

  - kind: mediate
    id: anonymous
    tool: get_compensation
    args: {employee_id: e-1001}
    backend: {employee_id: e-1001, salary: 185000}
