- scenario: identity-jwt
  request: unknown-kid
  field: upstream_calls
  before: []
  after:
  - form: {}
    method: GET
    path: /jwks
  cause: identity/jwt refetches the JWKS on demand when a token names a `kid` it does not hold, at most
    once per `min_refresh_interval_secs` (praxis-policy CHANGELOG 0.2.0, Changed, "`identity-jwt` refreshes
    JWKS on demand instead of on a timer", and Fixed, praxis-proxy/policy#29). The refetched set still
    lacks the key, so the token is rejected with the same code.
- scenario: identity-jwt
  request: authenticated-open-route
  field: stages[0].payload
  before:
    identity:
      caller_workload: null
      client: null
      delegation: null
      raw_claims:
        aud: cpex-parity
        exp: 4102444800
        iat: 1767225600
        iss: https://idp.parity.test
        roles:
        - engineer
        sub: evan
      raw_credentials:
        delegated_tokens: []
        inbound_tokens:
        - kind: jwt
          role: user
          source_header: Authorization
          token: <token>
      subject:
        claims: {}
        id: evan
        permissions: []
        roles:
        - engineer
        teams: []
  after: null
  cause: 'Under PPE''s default `dispatch: policy` an identity plugin runs only on routes whose `authentication:`
    names it (praxis-policy CHANGELOG 0.2.0, Changed, "`engine_settings.dispatch:` defaults to `policy`").
    `search_repos` lists none, so 0.3.0 does not validate the bearer and no subject or inbound credential
    reaches the pre and post stages; 0.2.3 ran the identity plugin on every route. The decision matches
    because the route allows everyone. A route that reads `subject` or `authenticated` must now list `authentication:`.'
