# Reviewed differences between the CPEX 0.2.3 snapshots (snapshots/) and a
# CPEX 0.3.0 replay of the same requests through the migrated configs.
#
# The parity test fails on any difference not listed here, and on any entry
# that no longer matches a difference. Each entry names the scenario, the
# request id (`<load>` for the load block), the field path inside that
# request's record, the 0.2.3 value (`before`), the 0.3.0 value (`after`),
# and the cause. A field missing on one side reads as null.
#
# To review a new difference, run
#   cargo run -p cpex-parity-harness -- --diff
# which prints every difference and the unlisted ones in this format.

differences:
- scenario: delegation-oauth
  request: engineer-denied-before-delegation
  field: code
  before: routes.tool:get_compensation.apl.pre_invocation[0]
  after: routes.tool:get_compensation.pre_invocation[0]
  cause: 'Rule-path deny code. A step without a custom deny code reports its source path, and PPE builds
    that path without the `.apl.` segment 0.2.3 inserted (PPE removed the `apl:` wrapper at every scope:
    praxis-policy CHANGELOG 0.2.0, Removed, "The `apl:` wrapper"). Same decision, same failing step index.'
- scenario: delegation-oauth
  request: engineer-denied-before-delegation
  field: stages[1].violation.code
  before: routes.tool:get_compensation.apl.pre_invocation[0]
  after: routes.tool:get_compensation.pre_invocation[0]
  cause: 'Rule-path deny code. A step without a custom deny code reports its source path, and PPE builds
    that path without the `.apl.` segment 0.2.3 inserted (PPE removed the `apl:` wrapper at every scope:
