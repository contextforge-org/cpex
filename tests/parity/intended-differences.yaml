- scenario: delegation-oauth
  request: audience-refused
  field: stages[1].violation.reason
  before: 'invalid_target: audience not allowed for this client'
  after: 'token exchange rejected: invalid_target'
  cause: PPE no longer forwards the token endpoint's `error_description` on a token-exchange denial, only
    the OAuth `error` code (praxis-policy CHANGELOG 0.2.0, Security, "Leg-2 token-exchange denials no
    longer forward `error_description` or the raw body", praxis-proxy/policy#16). The violation code and
    decision are unchanged.
