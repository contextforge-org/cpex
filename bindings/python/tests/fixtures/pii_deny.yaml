#
# Test fixture: deny a tool call whose `ssn` argument holds a US SSN.
#
# Used by test_manager.py and test_result.py: a cmf.tool_pre_invoke on
# tool `lookup_person` with an SSN in the arguments gives
# continue_processing=False and a violation with code `pii.ssn_detected`.
#
# The check is a CEL decision on the route. A CEL `expr` states when the
# call is allowed; `on_deny` names the violation reported otherwise.
# Routes are selected by `extensions.meta.entity_type` / `entity_name`,
# so a call without that meta (or for another tool) is allowed.

global:
  pdp:
    - kind: cel

routes:
  - tool: lookup_person
    authorization:
      pre_invocation:
        - cel:
            expr: "!(has(args.ssn) && args.ssn.matches('^[0-9]{3}-[0-9]{2}-[0-9]{4}$'))"
            on_deny:
              - "deny('ssn found in tool arguments', 'pii.ssn_detected')"
