#
# Test fixture: redact the `ssn` argument of a tool call.
#
# Used by test_manager.py to cover the modified_payload round-trip: a
# cmf.tool_pre_invoke on tool `lookup_person` gives continue_processing=True
# and a modified_payload whose `ssn` argument reads `[REDACTED]`.
#
# The `args:` field pipeline rewrites the argument before the call goes
# out. The `allow` step is there because an `authorization:` block must
# name at least one step.

routes:
  - tool: lookup_person
    args:
      ssn: "str | redact"
    authorization:
      pre_invocation:
        - "allow"
