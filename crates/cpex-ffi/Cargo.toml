#
# CPEX FFI — C API for embedding the CPEX runtime in Go, Python, etc.
# Compiles to a shared library (cdylib) exporting extern "C" functions.
# Payloads cross the FFI boundary as MessagePack bytes.

[package]
name = "cpex-ffi"
description = "CPEX C FFI — shared library for Go/Python/WASM host bindings."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
praxis-policy-core = { workspace = true }
# The CPEX facade: PPE with every stable builtin, the bundled hyper transport
# and the Vault secret provider, plus the host wiring the bindings share
# (`cpex::host`). `install_builtins` expands to explicit `register_factory`
# calls, so the factory symbols survive in the staticlib (no inventory/linkme
# link-section GC hazard). The Valkey session store pulls a redis client and a
# rustls TLS stack, so it adds materially to the `.a` size and to the musl
# cross-build surface.
cpex = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
serde_bytes = { workspace = true }
tracing = { workspace = true }

[features]
# No opt-in features: the bundled set (including the Valkey session store) is
# fixed by the cpex facade dependency above.
default = []

[dev-dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
# Mint test JWTs and their JWKS for the identity-jwt egress tests. The key is
# generated at test time, so no private key is checked in.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "1"

[lints]
workspace = true
