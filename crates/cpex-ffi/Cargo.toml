# CPEX FFI — C API for embedding the CPEX runtime in Go, Python, etc.
# Compiles to a shared library (cdylib) exporting extern "C" functions.
# Payloads cross the FFI boundary as MessagePack bytes.

[package]
name = "cpex-ffi"
description = "CPEX C FFI — shared library for Go/Python/WASM host bindings."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
praxis-policy-core = { workspace = true }
# APL governance layer, so Go/Python hosts can enable APL policies and route
# handlers via the `cpex_apl_install` FFI entry point.
praxis-policy-apl-runtime = { workspace = true }
# The engine facade with every stable builtin and the bundled hyper transport.
# Its `register_builtin_plugins` expands to explicit `register_factory` calls,
# so the factory symbols survive in the staticlib (no inventory/linkme
# link-section GC hazard). The Valkey session store pulls a redis client and a
# rustls TLS stack, so it adds materially to the `.a` size and to the musl
# cross-build surface.
praxis-policy = { workspace = true, features = ["builtins", "http-hyper"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
serde_bytes = { workspace = true }
tracing = { workspace = true }

[features]
# No opt-in features: the bundled set (including the Valkey session store) is
# fixed in the praxis-policy dependency above.
default = []

[dev-dependencies]
async-trait = { workspace = true }

[lints]
workspace = true
