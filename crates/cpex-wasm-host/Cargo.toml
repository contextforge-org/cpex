[package]
name = "cpex-wasm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WASM plugin host runtime for the CPEX framework — sandboxed wasmtime execution with capability-based access control"
authors = ["Shriti Priya"]
repository.workspace = true
homepage.workspace = true
keywords = ["wasm", "plugin", "sandbox", "wasmtime", "cpex"]
categories = ["wasm", "development-tools"]
exclude = ["wasm/", "examples/data/", "benchmarking/performance_comparison.png"]

[dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "rt-multi-thread", "time", "signal", "net"] }
wasmtime = { version = "46.0", features = ["component-model", "async"] }
wasmtime-wasi = "46.0"
wasmtime-wasi-http = { version = "46.0", features = ["default-send-request"] }
hyper = "1"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
cpex-core = { workspace = true }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
async-trait = "0.1"
serde_yaml = "0.9"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[[bench]]
name = "invocation"
harness = false
path = "benchmarking/invocation.rs"

[[bench]]
name = "comprehensive"
harness = false
path = "benchmarking/comprehensive.rs"
