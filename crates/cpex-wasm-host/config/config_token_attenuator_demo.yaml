# Token Attenuator Demo Configuration
#
# One WASM plugin (token-attenuator) registered for the "token.delegate" hook.
# The host constructs a DelegationPayload and fires invoke_named — the plugin
# mints a scoped outbound credential for each tool target.

plugin_settings:
  routing_enabled: true
  plugin_timeout: 30

plugins:
  - name: token-attenuator
    kind: wasm://token-attenuator.wasm
    hooks: [token.delegate]
    mode: sequential
    priority: 10
    on_error: fail
    config:
      sandbox_policy:
        allowed_filesystem: []
        allowed_network: []
        allowed_env: []
        resources:
          max_memory_bytes: 10485760
          max_fuel: 1000000000
          max_execution_time_ms: 5000
          max_instances: 10
          max_tables: 10
