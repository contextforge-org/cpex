# Identity Resolve Test Configuration
#
# One WASM plugin (identity-checker) registered for the "identity.resolve" hook.
# The host sends an IdentityPayload with request headers; the plugin resolves
# the subject from the x-user-id header.

plugin_settings:
  routing_enabled: true
  plugin_timeout: 30

plugins:
  - name: identity-checker
    kind: wasm://identity-checker.wasm
    hooks: [identity.resolve]
    mode: sequential
    priority: 10
    on_error: fail
    config:
      sandbox_policy:
        allowed_filesystem: []
        allowed_network: []
        allowed_env: []
        resources:
          max_memory_bytes: 10485760
          max_fuel: 1000000000
          max_execution_time_ms: 5000
          max_instances: 10
          max_tables: 10
