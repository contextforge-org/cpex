# Location: ./crates/cpex/Cargo.toml
# Copyright 2025
# SPDX-License-Identifier: Apache-2.0
# Authors: Fred Araujo
#
# cpex: host facade over the praxis-policy engine (PPE).
#
# One dependency instead of a dozen: re-exports PPE's public surface
# (PolicyEngine, AplOptions, register_apl, prelude, the builtin factories and
# the bundled hyper HTTP transport). Every PPE builtin is compiled in, so
#
#   cpex = "0.3"
#
# then `cpex::install_builtins(&engine)` registers every bundled factory and
# installs the APL config visitor in one call.

[package]
name = "cpex"
description = "CPEX host facade: re-exports the praxis-policy engine with its bundled builtins."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# Use the project's root README as this crate's crates.io page (inherited path
# is workspace-root-relative; cargo bundles it into the published .crate).
readme.workspace = true

# Build docs.rs with the optional Python host too, so its re-exports render.
[package.metadata.docs.rs]
all-features = true

[features]
default = []

# Out-of-process host for existing Python CPEX plugins. Spawns a `worker.py`
# subprocess per plugin, so it stays opt-in.
python-host = ["dep:cpex-hosts-python"]

[dependencies]
# The engine, with every stable builtin and the bundled hyper transport.
praxis-policy = { workspace = true, features = ["builtins", "http-hyper"] }

# Python plugin host. Runs each Python plugin out-of-process, in its own
# virtualenv, from the Rust PolicyEngine. Present only with `python-host`.
cpex-hosts-python = { workspace = true, optional = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true
